[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fedline"
version = "0.1.0"
description = "Redline the effect of a congressional bill on the underlying statutory text."
requires-python = ">=3.12"
dependencies = []

[project.scripts]
fedline = "fedline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
